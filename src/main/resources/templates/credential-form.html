<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}"
      th:with="typeLabel=#{${'cred.type.' + type.id()}},
               pageTitle=${originalName == null} ? #{cred.form.titleNew(${typeLabel})} : #{cred.form.titleEdit(${originalName})}">
<head>
    <th:block th:replace="~{fragments :: headCommon(${pageTitle})}"></th:block>
</head>
<body>
<header th:replace="~{fragments :: topbar('credentials')}"></header>

<main class="page narrow">
    <a class="muted" th:href="@{/credentials}" th:text="#{cred.form.back}">← Kimlik bilgileri</a>
    <h1 th:text="${pageTitle}">Kimlik bilgisi</h1>
    <p class="muted" th:text="#{${'cred.type.' + type.id() + '.desc'}}">description</p>

    <p class="flash error" th:if="${error}" th:text="${error}"></p>
    <p class="flash error" th:if="${unreadable}" th:text="#{cred.unreadable.form}">This credential was encrypted with a different encryption key, so its stored values cannot be read. Fill in all fields (including secrets) and save to re-encrypt it with the current key.</p>

    <form class="card form" th:action="@{/credentials}" method="post" autocomplete="off">
        <input type="hidden" name="originalName" th:value="${originalName}">
        <input type="hidden" name="type" th:value="${type.id()}">

        <label>
            <span><span th:text="#{cred.form.name}">Ad</span> <em class="req" th:text="#{cred.form.required}">zorunlu</em></span>
            <input name="name" th:value="${name}" pattern="[A-Za-z0-9_-]{1,100}" required>
            <small class="muted" th:text="#{cred.form.nameHint}">ipucu</small>
        </label>

        <label th:each="f : ${fields}">
            <span>
                <span th:text="${labels[f.name()]}">Alan</span>
                <em class="req" th:if="${f.required()}" th:text="#{cred.form.required}">zorunlu</em>
            </span>

            <select th:if="${!f.options().isEmpty()}" th:name="'f_' + ${f.name()}">
                <option th:each="o : ${f.options()}" th:value="${o}" th:text="${o}"
                        th:selected="${o == values[f.name()]}"></option>
            </select>

            <input th:if="${f.options().isEmpty() and !f.secret()}" type="text"
                   th:name="'f_' + ${f.name()}" th:value="${values[f.name()]}"
                   th:required="${f.required()}" spellcheck="false">

            <textarea th:if="${f.secret() and f.multiline()}" rows="6" class="mono"
                      th:name="'f_' + ${f.name()}" spellcheck="false"
                      th:required="${f.required() and secretsPresent[f.name()] != true}"></textarea>
            <input th:if="${f.secret() and !f.multiline()}" type="password" autocomplete="new-password"
                   th:name="'f_' + ${f.name()}" value=""
                   th:required="${f.required() and secretsPresent[f.name()] != true}" spellcheck="false">
            <small class="ok-text" th:if="${f.secret() and secretsPresent[f.name()] == true}"
                   th:text="#{cred.form.secretStored}">Stored. Type a new value to change it; leave empty to keep the current one.</small>

            <small class="muted" th:if="${!hints[f.name()].isEmpty()}" th:text="${hints[f.name()]}">ipucu</small>
        </label>

        <div class="row">
            <span class="spacer"></span>
            <a class="btn" th:href="@{/credentials}" th:text="#{common.cancel}">Cancel</a>
            <button class="btn primary" type="submit" th:text="#{common.save}">Kaydet</button>
        </div>
    </form>
</main>
</body>
</html>
